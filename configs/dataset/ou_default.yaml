process: ou

# --- PathConfig ---
n_steps: 1000
T_horizon: 1.0
S0: 1.0
n_paths: 100000
sig_depth: 6
sig_type: logsig   # logsig only
aug_type:
  - TA
  - TLL3
seed: 42
output_root: _data

# --- OU-specific (theta = mean-reversion speed kappa) ---
theta: [0.5, 5.0]
mu: 3.0
sigma: [1.5, 2.5]

# --- Validation split ---
val: {n_paths: 100, seed: 44}

# --- Test distributions (quantitative, then qualitative) ---
test:
  - {n_paths: 1000, seed: 43}
  - {n_paths: 100, seed: 43, theta: 0.5, mu: 3.0, sigma: 2.0}
  - {n_paths: 100, seed: 43, theta: 2.0, mu: 3.0, sigma: 2.0}
  - {n_paths: 100, seed: 43, theta: 5.0, mu: 3.0, sigma: 2.0}
