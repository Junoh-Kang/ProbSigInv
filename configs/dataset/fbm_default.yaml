process: fbm

# --- PathConfig ---
n_steps: 1000
T_horizon: 1.0
S0: 1.0
n_paths: 100000
sig_depth: 6
sig_type: logsig   # logsig only
aug_type:
  - TA
  - TLL3
seed: 42
output_root: _data

# --- fBM-specific ---
mu: [1.5, 2.5]
sigma: [1.5, 2.5]
hurst: [0.25, 0.75]
method: daviesharte  # daviesharte | cholesky | hosking

# --- Validation split ---
val: {n_paths: 100, seed: 44}

# --- Test distributions (quantitative, then qualitative) ---
test:
  - {n_paths: 1000, seed: 43}
  - {n_paths: 100, seed: 43, mu: 2.0, sigma: 2.0, hurst: 0.3}
  - {n_paths: 100, seed: 43, mu: 2.0, sigma: 2.0, hurst: 0.5}
  - {n_paths: 100, seed: 43, mu: 2.0, sigma: 2.0, hurst: 0.7}
