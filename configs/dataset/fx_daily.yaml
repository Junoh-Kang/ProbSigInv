process: finance
source: fx            # sp500 | fx
source_path: _data/exchange_rates.npy

# --- Source ---
# Source rates are USD per unit of each selected currency.
source_labels: [AUD, GBP, CAD, CHF, CNY, JPY, NZD, SGD]
currencies: [GBP, JPY]

# --- Window settings ---
n_steps: 252          # ~1 trading year per window
window_stride: 1
T_horizon: 1.0
S0: 1.0
path_scale: 10.0

# --- Signature ---
sig_depth: 6
sig_type: logsig      # logsig only
aug_type:
  - TA
  - TLL3
output_root: _data

# --- Train split ---
train_ratio: 0.8

# --- Test splits ---
# in-distribution reuses the train interval; out-distribution is the held-out tail.
test:
  - {tag: in-distribution, window_stride: 63}
  - {tag: out-distribution, window_stride: 5}
