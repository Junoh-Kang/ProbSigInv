process: gbm

# --- PathConfig ---
n_steps: 1000
T_horizon: 1.0
S0: 1.0
n_paths: 100000
path_dim: 2
sig_depth: 6
sig_type: logsig   # logsig only
aug_type:
  - TA
seed: 42
output_root: _data

# --- GBM-specific ---
mu: [1.5, 2.5]
sigma: [1.5, 2.5]
gbm_rho: [-0.7, 0.7]

# --- Validation split ---
val: {n_paths: 1000, seed: 44}

# --- Test distributions (quantitative, then qualitative) ---
test:
  - {n_paths: 1000, seed: 43}
  - {n_paths: 100, seed: 43, mu: 2.0, sigma: 2.0, gbm_rho: -0.7}
  - {n_paths: 100, seed: 43, mu: 2.0, sigma: 2.0, gbm_rho: 0.0}
  - {n_paths: 100, seed: 43, mu: 2.0, sigma: 2.0, gbm_rho: 0.7}
